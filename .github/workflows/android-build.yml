name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Project
      run: |
        # ১. যদি কোনো জিপ ফাইল থাকে, তাহলে আনজিপ করবে
        if ls *.zip 1> /dev/null 2>&1; then
          echo "ZIP file found! Extracting..."
          unzip -q *.zip
        fi

        # ২. settings.gradle.kts ফাইলটি কোথায় আছে খুঁজবে
        PROJECT_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "Error: Could not find settings.gradle.kts anywhere!"
          exit 1
        fi
        
        # ৩. প্রজেক্টের সঠিক ফোল্ডারে যাবে
        cd "$(dirname "$PROJECT_DIR")"
        echo "Building project in: $(pwd)"
        
        # ৪. বিল্ড করবে
        gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GeminiKeyboard-APK
        path: "**/*.apk"
