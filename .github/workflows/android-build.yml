name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unzip project (if uploaded as zip)
        run: |
          if [ -f GeminiKeyboard.zip ]; then unzip -q -o GeminiKeyboard.zip; fi

      - name: Build debug APK
        run: |
          DIR=.
          if [ -f GeminiKeyboard/settings.gradle.kts ]; then DIR=GeminiKeyboard; fi
          cd "$DIR"
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/GeminiKeyboard.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: GeminiKeyboard-apk
          path: GeminiKeyboard.apk

      - name: Publish release (direct APK download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GeminiKeyboard build ${{ github.run_number }}
          files: GeminiKeyboard.apk
